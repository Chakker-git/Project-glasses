name: build

on:
  push:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test
      # Plain folder layout (exe + DLLs), not single-file: single-file self-extracting bundles are a
      # common antivirus false-positive trigger for unsigned apps.
      - name: Publish
        run: |
          dotnet publish src/GlassesDesk -c Release -r win-x64 --self-contained true -o publish/ProjectGlasses
          dotnet publish src/GlassesProbe -c Release -r win-x64 --self-contained true -o publish/ProjectGlasses
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectGlasses-win-x64
          path: publish/ProjectGlasses
